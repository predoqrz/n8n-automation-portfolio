services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Banco
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Acesso
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${WEBHOOK_URL}

      # Criptografia das credenciais salvas. Gere uma vez e NÃO perca:
      # openssl rand -base64 32
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Comportamento
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    depends_on:
      postgres:
        condition: service_healthy

  evolution:
    # Gateway WhatsApp não-oficial (protocolo do WhatsApp Web, via Baileys), self-hosted.
    # Existe para o workflow 05: fora dos Termos de Uso do WhatsApp, por isso não conecta
    # o número principal de ninguém — ver a decisão técnica no README do workflow.
    image: evoapicloud/evolution-api:latest
    container_name: evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Autenticação da própria API da Evolution — vai no cabeçalho `apikey` de toda
      # chamada. Não é o número de WhatsApp; é a chave que protege este servidor.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}

      # Banco. Mesma instância Postgres do n8n, banco separado (schema próprio da
      # Evolution) para não misturar com as tabelas do workflow 01/02.
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      # Cache sem Redis: um serviço a mais rodando 24h só para isso não compensa
      # numa VPS pequena de portfólio. Local cache em memória resolve.
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080

      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
  evolution_instances:
